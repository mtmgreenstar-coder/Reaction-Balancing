name: Build Reaction Balancer V4.0 APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Reaction-Balancer-Android-V4.0-Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Reaction-Balancer-Android-V4.0-Source.zip
          test -f Reaction-Balancer-Android/app/src/main/assets/index.html
          sed -i "s/targetSdk 28/targetSdk 35/" Reaction-Balancer-Android/app/build.gradle
          sed -i "s/versionCode 4/versionCode 5/" Reaction-Balancer-Android/app/build.gradle
          sed -i "s/versionName .*/versionName '4.0'/" Reaction-Balancer-Android/app/build.gradle
          grep -E 'compileSdk|targetSdk|versionCode|versionName' Reaction-Balancer-Android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: Reaction-Balancer-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reaction-Balancer-V4.0-APK
          path: Reaction-Balancer-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
